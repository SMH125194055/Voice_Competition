<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Voice Agent - VAD with Voice Cloning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 1.1rem;
        }

        .status-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .phase-indicator {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 15px 0;
        }

        .phase-badge {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .phase-badge.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transform: scale(1.1);
        }

        .progress-bar {
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 13px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .start-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .response-panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .response-text {
            line-height: 1.9;
            font-size: 17px;
        }

        .highlighted-word {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: 4px;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
            animation: highlight-pulse 0.5s ease;
        }

        @keyframes highlight-pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .messages-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
        }

        .message.user {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
        }

        .message.assistant {
            background: rgba(0, 255, 136, 0.1);
            border-left: 4px solid #00ff88;
        }

        .message-role {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Streaming Voice Agent</h1>
            <p>Real-time conversation with voice cloning, chunked TTS, and text highlighting</p>
        </div>

        <div class="status-panel">
            <div class="status-text" id="status">Click "Start Listening" to begin</div>
            
            <div class="phase-indicator">
                <div class="phase-badge" id="phase-vad">VAD</div>
                <div class="phase-badge" id="phase-stt">STT</div>
                <div class="phase-badge" id="phase-llm">LLM</div>
                <div class="phase-badge" id="phase-tts">TTS</div>
            </div>

            <div class="progress-bar" id="progress-bar" style="display: none;">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-text" id="progress-text">0/0</div>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="controls">
            <button class="start-button" id="start-button" onclick="startListening()">
                ▶️ Start Listening
            </button>
        </div>

        <div class="response-panel" id="response-panel" style="display: none;">
            <h3>✨ AI Response (with live highlighting):</h3>
            <div class="response-text" id="response-text"></div>
        </div>

        <div class="messages-container">
            <h3>💬 Conversation History</h3>
            <div id="messages"></div>
        </div>
    </div>

    <script>
        // Note: This is a placeholder. You need to integrate with the VAD library.
        // For now, this shows the SSE handling logic.

        function startListening() {
            alert('Please integrate this with React VADVoiceAgentStreaming component in the actual app!\\n\\nOr use the /vad page in the React app.');
        }

        // Example SSE handling (for reference)
        async function handleStreamingConversation(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'audio.wav');

            try {
                const response = await fetch('http://localhost:8000/vad-chat-voice-stream', {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('event:')) continue;
                        if (line.startsWith('data:')) {
                            const data = JSON.parse(line.substring(6));
                            handleSSEEvent(data);
                        }
                    }
                }
            } catch (error) {
                console.error('Streaming error:', error);
            }
        }

        function handleSSEEvent(data) {
            console.log('SSE Event:', data);
            // Handle different event types here
        }
    </script>
</body>
</html>
